name: logmein-host
version: '1.2.1'
summary: The LogMeIn Host Software (Beta) for Linux # 79 char long summary
icon: snap/gui/icon.png
base: core24
description: |-
 LogMeIn allows you to access your computers from any device.

 You can connect to a Linux host, in an web-based secure shell and it allows you to send commands to the host computer.

 Requirement: the web-based shell logs in with SSH to the host itself, so an SSH server (e.g. openssh-server) must be installed and running on the computer.

 For more information on LogMeIn for Linux and how to attach your host to your account, try the developer website.

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots

parts:
  pytty:
    plugin: python
    source: .
    python-requirements: [ requirements.txt ]
    build-packages: [ build-essential, python3-dev ]
    stage-packages: [ openssh-client ]
  reverse-proxy:
    source: reverse-proxy/
    plugin: npm
    npm-include-node: true
    # wetty 1.3.x pulls node-pty 0.9.0 (native), which does not build on newer Node.
    npm-node-version: 12.22.12
    build-environment:
      - npm_config_unsafe_perm: 'true'
      - npm_config_python: /usr/bin/python3
    build-packages: [ git, gcc, g++, make, python3, python3-setuptools, build-essential ]

apps:
  pytty:
    command: bin/pytty
    daemon: simple
    restart-condition: always
    plugs: [ network, network-bind, process-control ]
  wetty:
    command: bin/wetty --port 23822 --title LogMeIn --base /xterm/ --host 127.0.0.1 --forcessh
    daemon: simple
    restart-condition: always
    plugs: [ network, network-bind, process-control ]
  logmein-host:
    command: bin/logmein_host
    daemon: simple
    restart-condition: always
    plugs: [ network, network-bind, process-control ]
  reverse-proxy:
    command: bin/reverse-proxy
    daemon: simple
    restart-condition: always
    plugs: [ network, network-bind, process-control, hostname-control ]
